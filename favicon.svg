<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="45%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Globe Gradient -->
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.8" />
    </radialGradient>

    <!-- Trail Gradient -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0" />
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Plane Shadow Filter -->
    <filter id="planeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="6" stdDeviation="8" flood-color="#021c1a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="5" />

  <!-- Background Decorative Grid Lines (Subtle) -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <circle cx="236" cy="272" r="185" fill="none" />
    <circle cx="236" cy="272" r="235" fill="none" stroke-dasharray="8 8" />
  </g>

  <!-- Globe Body -->
  <circle cx="236" cy="272" r="132" fill="url(#globeGrad)" stroke="#5eead4" stroke-width="7" />

  <!-- Globe Latitudes and Longitudes -->
  <!-- Equator & Parallels -->
  <ellipse cx="236" cy="272" rx="132" ry="46" fill="none" stroke="#2dd4bf" stroke-width="4.5" opacity="0.65" />
  <ellipse cx="236" cy="216" rx="114" ry="34" fill="none" stroke="#2dd4bf" stroke-width="3.5" opacity="0.45" />
  <ellipse cx="236" cy="328" rx="114" ry="34" fill="none" stroke="#2dd4bf" stroke-width="3.5" opacity="0.45" />

  <!-- Meridians -->
  <ellipse cx="236" cy="272" rx="58" ry="132" fill="none" stroke="#2dd4bf" stroke-width="4.5" opacity="0.65" />
  <line x1="236" y1="140" x2="236" y2="404" stroke="#2dd4bf" stroke-width="4" opacity="0.65" />

  <!-- Orbiting Flight Path Trajectory -->
  <path d="M 102 344 C 112 430, 276 446, 362 376 C 438 314, 436 210, 368 152"
        fill="none"
        stroke="url(#trailGrad)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-dasharray="16 10" />

  <!-- Modern Sleek Plane Flying Upwards-Right -->
  <g transform="translate(378, 142) rotate(42)" filter="url(#planeShadow)">
    <!-- Plane Fuselage & Wings -->
    <path d="M 0 -48 
             C 4 -32, 7 -16, 7 0 
             L 52 20 
             L 52 30 
             L 7 16 
             L 7 36 
             L 22 48 
             L 22 56 
             L 0 50 
             L -22 56 
             L -22 48 
             L -7 36 
             L -7 16 
             L -52 30 
             L -52 20 
             L -7 0 
             C -7 -16, -4 -32, 0 -48 Z" 
          fill="#ffffff" />
    <!-- Cockpit & Body Highlight -->
    <path d="M 0 -38 C 2 -24, 2 -8, 2 8 L -2 8 C -2 -8, -2 -24, 0 -38 Z" fill="#2dd4bf" opacity="0.7" />
  </g>

  <!-- Sparkle Stars -->
  <!-- Top Right Sparkle -->
  <g transform="translate(424, 88)" fill="#fef08a">
    <path d="M 0 -18 Q 0 0, 18 0 Q 0 0, 0 18 Q 0 0, -18 0 Q 0 0, 0 -18 Z" />
  </g>
  <!-- Smaller Sparkle -->
  <g transform="translate(92, 138)" fill="#a7f3d0" opacity="0.85">
    <path d="M 0 -11 Q 0 0, 11 0 Q 0 0, 0 11 Q 0 0, -11 0 Q 0 0, 0 -11 Z" />
  </g>
</svg>